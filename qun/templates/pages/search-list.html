

{% extends "layouts/app.html" %}
{% load static %} 

{% block title %}
Searched News
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/card.css' %}" />

<div class="container">
    <div class="row py-3">
        <h1>Searched News</h1>
        
        {% for news in newsData %}
        
        <div class="col-md-4 mb-3">
            <div class="card">
                
                {% if news.image %}
                <img src="{{ news.image.url }}" 
                     class="card-img-top" 
                     alt="{{ news.title }}" 
                     style="height: 300px; object-fit: cover;" />
                {% endif %}
                
                <div class="card-body">
                    <h5 class="card-title">{{ news.title }}</h5>
                    <p class="card-text">
                        {{ news.description | truncatewords:25 }}
                    </p>
                    <a href="{% url "news-details" news.slug %}" class="btn btn-primary">Read More</a>
                </div>

            </div>
        </div>

        {% endfor %}
    </div>
</div>

{% endblock %}
